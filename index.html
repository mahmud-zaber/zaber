<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background: radial-gradient(circle at top, #2b0000, #000);
    font-family: 'Poppins', sans-serif;
    color:#fff;
    overflow:hidden;
}

/* Center Content */
.container{
    position:relative;
    z-index:10;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* Main Text */
h1{
    font-family:'Playfair Display', serif;
    font-size:2.5rem;
    color:#ff4d6d;
    margin-bottom:15px;
}

p{
    font-size:1rem;
    line-height:1.8;
    max-width:600px;
    opacity:0.9;
}

/* Button */
button{
    margin-top:30px;
    padding:14px 30px;
    font-size:1rem;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#ff4d6d,#ff758f);
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px rgba(255,77,109,0.6);
    transition:transform 0.3s;
}

button:hover{
    transform:scale(1.08);
}

/* Floating Roses */
.rose{
    position:absolute;
    top:-10%;
    font-size:24px;
    animation:fall linear infinite;
    opacity:0.8;
}

@keyframes fall{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    10%{opacity:1;}
    100%{
        transform:translateY(120vh) rotate(360deg);
        opacity:0;
    }
}

/* Footer */
.signature{
    position:absolute;
    bottom:20px;
    font-size:0.9rem;
    opacity:0.7;
}
</style>
</head>

<body>

<audio id="music" loop>
    <source src="22.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Happy Rose Day, My Rizin 🌹</h1>
    <p>
        I lovee u soo muchh Babyy
        U mean a lot to me
        You're my WIfe
        You're my Babyy
        A lot of roses for u ❤️❤️🫂
    </p>

    <button onclick="startLove()">Tap to Feel My Love ❤️</button>

    <div class="signature">
        — Always yours, Zaber
    </div>
</div>

<script>
function startLove(){
    document.getElementById("music").play();
}

/* Create falling roses */
const roseEmojis = ["🌹","🌹","🥀","🌺"];
for(let i=0;i<30;i++){
    let rose = document.createElement("div");
    rose.className = "rose";
    rose.innerText = roseEmojis[Math.floor(Math.random()*roseEmojis.length)];
    rose.style.left = Math.random()*100 + "vw";
    rose.style.animationDuration = (5 + Math.random()*5) + "s";
    rose.style.fontSize = (18 + Math.random()*20) + "px";
    document.body.appendChild(rose);
}
</script>

</body>
</html>
