<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid Mubarak ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #020111, #191621);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* Moon */
.moon {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fff, #ddd);
    border-radius: 50%;
    position: absolute;
    top: 50px;
    right: 50px;
    box-shadow: 0 0 40px #fff;
}

/* Stars */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

.container {
    padding-top: 150px;
}

h1 {
    font-size: 3rem;
    color: gold;
}

button {
    padding: 12px 25px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    background: gold;
    color: black;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: white;
}

.message-box {
    margin-top: 20px;
    font-size: 1.2rem;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    display: none;
}

.heart {
    color: red;
    font-size: 2rem;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="moon"></div>

<!-- Stars -->
<script>
for(let i=0;i<60;i++){
    let star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random()*100+"vh";
    star.style.left = Math.random()*100+"vw";
    document.body.appendChild(star);
}
</script>

<div class="container">
    <h1>Eid Mubarak, My Love 🌙❤️</h1>

    <button onclick="showMessage()">Open My Heart 💌</button>
    <button onclick="playMusic()">Play Music 🎶</button>

    <div class="message-box" id="msg">
        You are the most beautiful blessing in my life.<br><br>
        This Eid, I just want you to know...<br><br>
        No matter the distance, you are always in my heart.<br><br>
        Eid Mubarak, my love ❤️<br><br>
        <div class="heart">❤️</div>
    </div>
</div>

<audio id="music">
    <source src="22.mp3" type="audio/mpeg">
</audio>

<script>
function showMessage() {
    document.getElementById("msg").style.display = "block";
}

function playMusic() {
    document.getElementById("music").play();
}
</script>

</body>
</html>
